services:
  app:
    build: .
    expose:
      - "80"
    networks:
      - coolify
      - default
    environment:
      - DB_DRIVER=mysql
      - DB_HOST=db
      - DB_NAME=marted
      - DB_USER=marted
      - DB_PASS=${DB_PASS:-martedpass}
      - ADMIN_PASS=${ADMIN_PASS:-marted2024}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.marted-http.entrypoints=http"
      - "traefik.http.routers.marted-http.rule=Host(`marted.187.124.9.37.nip.io`)"
      - "traefik.http.routers.marted-http.middlewares=marted-redirect"
      - "traefik.http.middlewares.marted-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.marted.entrypoints=https"
      - "traefik.http.routers.marted.rule=Host(`marted.187.124.9.37.nip.io`)"
      - "traefik.http.routers.marted.service=marted-svc"
      - "traefik.http.routers.marted.tls.certresolver=letsencrypt"
      - "traefik.http.services.marted-svc.loadbalancer.server.port=80"
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mariadb:11
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASS:-rootpass}
      - MYSQL_DATABASE=marted
      - MYSQL_USER=marted
      - MYSQL_PASSWORD=${DB_PASS:-martedpass}
    volumes:
      - dbdata:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped

networks:
  coolify:
    external: true
  default:

volumes:
  dbdata:
