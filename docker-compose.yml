services:
  app:
    build: .
    ports:
      - "80"
    networks:
      - coolify
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.marted.rule=Host(`marted.187.124.9.37.sslip.io`)"
      - "traefik.http.routers.marted.entrypoints=web"
      - "traefik.http.services.marted.loadbalancer.server.port=80"
    environment:
      - DB_DRIVER=mysql
      - DB_HOST=db
      - DB_NAME=marted
      - DB_USER=marted
      - DB_PASS=${DB_PASS:-martedpass}
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mariadb:11
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASS:-rootpass}
      - MYSQL_DATABASE=marted
      - MYSQL_USER=marted
      - MYSQL_PASSWORD=${DB_PASS:-martedpass}
    volumes:
      - dbdata:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped

networks:
  coolify:
    external: true
  default:

volumes:
  dbdata: